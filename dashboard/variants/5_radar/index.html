<!doctype html>
<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--fg:#14202e;--mute:#5c6b7d;--line:#d9e0e8;--fc:#007A5A;--spot:#C2185B;--up:#D55E00;--down:#0072B2;--ok:#E8F3EE;--r:16px}
:root[data-theme=dark]{--bg:#0c121a;--card:#151d28;--fg:#e8eef6;--mute:#93a3b7;--line:#263140;--fc:#3ec79f;--spot:#f06292;--up:#ff9a55;--down:#5ab4ff;--ok:#16261f}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#0c121a;--card:#151d28;--fg:#e8eef6;--mute:#93a3b7;--line:#263140;--fc:#3ec79f;--spot:#f06292;--up:#ff9a55;--down:#5ab4ff;--ok:#16261f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:12px 12px 40px}
.top{position:relative;display:flex;align-items:center;gap:8px;margin-bottom:10px}.lctl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:8px;align-items:center}.top #run{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}@media(max-width:860px){.lctl,.top #run{position:static;transform:none}}.top h1{font-size:18px;margin:0;flex:1}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button.on{background:var(--fg);color:var(--bg)}
.card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line);position:relative}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--mute) transparent}
@supports selector(::-webkit-scrollbar){
  .days{scrollbar-width:auto;scrollbar-color:auto}
  .days::-webkit-scrollbar{height:6px}
  .days::-webkit-scrollbar-track{background:transparent}
  .days::-webkit-scrollbar-thumb{background:var(--mute);border-radius:999px}
  .days::-webkit-scrollbar-thumb:hover{background:var(--fg)}
}
.day{flex:0 0 auto;width:62px;border-radius:12px;border:2px solid transparent;padding:6px 4px;text-align:center;cursor:pointer;background:var(--bg)}
.day b{display:block;font-size:17px}.day small{display:block;color:var(--mute);font-size:11px}.day i{display:block;height:6px;border-radius:3px;margin:5px 4px 0}
.day.sel{border-color:var(--fc)}
.hours{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.hr{padding:3px 0;width:calc((100% - 92px)/24 + 0px);min-width:26px;border-radius:6px;text-align:center;font-size:11px;cursor:pointer;background:var(--bg);color:var(--mute);position:relative}
.hr.sel{background:var(--fc);color:#fff}.hr.act::after,.hr.watch::after{content:"";position:absolute;left:30%;right:30%;bottom:1px;height:3px;border-radius:2px;background:var(--up)}.hr.act::after{background:#C62828}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
.g{text-align:center}.g h3{font-size:12px;margin:0;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}.g .v{font-size:28px;font-weight:800;margin-top:-30px;position:relative}.g small{color:var(--mute);font-size:12px}
.tug{height:18px;border-radius:9px;background:var(--down);overflow:hidden;margin:14px 0 6px}.tug div{height:100%;background:var(--up)}
.tk{display:grid;grid-template-columns:repeat(5,1fr);margin:3px 10px 0 44px;font-size:10px;color:var(--mute)}
.sub{margin:8px 0 0}.sub .h4{margin-bottom:2px}.lg i.sq{height:10px;width:10px;border:0;border-radius:2px;opacity:.9}
.slot{height:30px;border-radius:4px;font-size:9px;display:flex;align-items:flex-end;justify-content:center;color:#fff;cursor:pointer;position:relative}
.slot.s{outline:2px solid var(--fg)}
.h4{font-size:12px;color:var(--mute);margin:0 0 4px;text-transform:uppercase;letter-spacing:.08em}
.row{display:block;margin-top:10px}
.tabs{display:flex;margin-left:14px;border:1px solid var(--line);border-radius:999px;overflow:hidden}.tabs a{padding:5px 16px;font-size:13px;font-weight:600;text-decoration:none;color:var(--fg)}.tabs a.on{background:var(--fg);color:var(--bg)}.tabs a:not(.on):hover{background:var(--bg)}
.synth{margin-left:10px;padding:2px 10px;border-radius:999px;background:#FFE9B8;color:#5a3d00;font-size:12px;font-weight:700}
#live{font-weight:700}#live.on{background:#E53935;border-color:#E53935;color:#fff}#live.on::before{content:"● ";animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.35}}
[hidden]{display:none!important}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,92vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;visibility:hidden;max-height:100vh;overflow:hidden}
.drawer.wide{width:min(620px,96vw)}
.drawer.open{transform:none;visibility:visible}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header b{font-size:15px}.drawer .body{padding:12px 16px 24px;overflow:auto;flex:1;min-height:0}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.top-alert{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;border-left:5px solid #E0A82E;background:var(--bg);border-radius:0 12px 12px 0;padding:10px 14px;margin:0 0 12px;font-size:14px;cursor:pointer}
.top-alert.act{border-color:#E53935}.top-alert.info{border-color:#2E9E5B}.top-alert .when{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}.top-alert .what{font-weight:700}.top-alert .chg{color:var(--mute)}
.top-alert.pin{box-shadow:0 0 0 2px var(--fg) inset}.top-alert .nv{margin-left:auto;display:inline-flex;align-items:center;gap:6px}.top-alert .nv small{color:var(--mute);font-size:12px}.top-alert .nv-b{padding:0 9px;font-size:16px;line-height:22px;border-radius:999px}
.top-alert .chk{flex-basis:100%;margin-top:2px;font-weight:600}
.ab{border-left:4px solid var(--up);padding:4px 10px;margin:6px 0;background:var(--bg);border-radius:0 8px 8px 0;font-size:14px}.ab.act{border-color:#C62828}
.zm{display:inline-flex;margin-left:8px}.zm button{padding:3px 9px;border-radius:0;min-width:30px}.zm button:first-child{border-radius:8px 0 0 8px}.zm button:last-child{border-radius:0 8px 8px 0}.zm button+button{margin-left:-1px}
.chd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}.chd .h4{margin:6px 0 0}.lg{display:flex;gap:2px 8px;flex-wrap:wrap;justify-content:flex-end;font-size:13px;color:var(--fg);margin:0}.lg .grp{display:inline-flex;gap:10px;align-items:center}.lg .grp b{color:var(--fg);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.lg .grp small{font-size:11px}.lg .grp{flex-wrap:wrap;gap:4px 10px}.lg .dv{width:1px;height:16px;background:var(--line)}.lgi{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;color:var(--fg);background:none;border:1px solid transparent;border-radius:8px;padding:2px 6px;cursor:pointer;min-width:0}.lgi:hover{border-color:var(--line)}.lgi.off{opacity:.4;text-decoration:line-through}.lgi.nostrike{text-decoration:none}.lgi small{color:var(--mute);font-size:11px}.lgi i.sq+i.sq{margin-left:-3px}.lg i.th{border-top-width:3px;opacity:.55}.lg span{display:inline-flex;align-items:center;gap:5px}.lg i{display:inline-block;width:18px;height:0;border-top:3px solid}.lg i.b{height:10px;border:0;border-radius:2px;opacity:.3}.lg i.d{border-top-style:dashed;border-top-width:2px}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;background:var(--ok);color:var(--fc)}
.gl{stroke:var(--line)}.gz{stroke:var(--mute)}.gm{stroke:var(--mute);stroke-dasharray:2 3}.ax{fill:var(--mute);font-size:10px}.xh{stroke:var(--mute)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:5px 9px;border-radius:7px;font-size:12px;white-space:nowrap;z-index:4}
.err{color:#C62828;padding:16px}
details.mx{margin-top:10px}details.mx>summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:10px}
details.mx>summary::-webkit-details-marker{display:none}details.mx>summary::before{content:"▸";transition:transform .15s}details.mx[open]>summary::before{transform:rotate(90deg)}
details.mx>summary small{font-weight:400;color:var(--mute);font-size:12px}
.mxbar{display:flex;gap:6px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}.mxbar .note{color:var(--mute);font-size:12px;margin-left:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 14px}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px}.tile h4{margin:0;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.tile b{display:block;font-size:24px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}.tile small{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.tile .good{color:#1B7F3B}.tile .bad{color:#C62828}
:root[data-theme=dark] .tile .good{color:#4CD07D}:root[data-theme=dark] .tile .bad{color:#FF6B6B}
@media (prefers-color-scheme:dark){:root[data-theme=auto] .tile .good{color:#4CD07D}:root[data-theme=auto] .tile .bad{color:#FF6B6B}}
.mxcharts{display:grid;grid-template-columns:1fr;gap:10px}
.mxc{background:var(--bg);border-radius:12px;padding:10px 12px}.mxc h4{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--fg)}.mxc h4 small{font-weight:400;color:var(--mute)}.mxc h4{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.mxc .mlg{display:inline-flex;gap:10px;font-weight:400;color:var(--fg);font-size:11px}.mxc .mlg i{display:inline-block;vertical-align:middle;margin-right:4px}.mlg .sq{width:9px;height:9px;border-radius:2px;background:var(--fc)}.mlg .ln{width:16px;border-top:2px dashed var(--spot)}.mlg .tg{width:16px;border-top:2px dashed var(--mute)}
.drv{margin-bottom:10px}.stk{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:3px 0 8px}.stk>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}
.stkrow{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.gleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin:2px 0 10px}.gleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.flist{display:grid;grid-template-columns:minmax(0,1.6fr) 56px minmax(0,1fr);gap:4px 10px;align-items:center;font-size:12px}.flist .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.flist .bar i{display:block;height:100%}.flist.gl{margin-bottom:12px;font-size:13px}.flist .bar.big{height:14px;border-radius:5px}
.flist .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}.drv .fn{font-size:11px;color:var(--mute);margin-top:8px}
.mxc svg text{fill:var(--mute);font-size:10px}.mxc .glx{stroke:var(--line)}
</style></head><body><main>
<div class="top"><h1>Radar</h1><div class="lctl" id="lctl" hidden></div><select id="run"></select><span class="synth" id="synth" hidden>Synthetic demo data</span><nav class="tabs" aria-label="Pages"><a id="tabE" href="?">Explore</a><a id="tabL" href="?run=live" hidden>Live</a></nav><button id="mbtn" class="abtn" aria-haspopup="dialog" aria-controls="mx" aria-expanded="false">Metrics</button><button id="theme" aria-label="Toggle theme">◐</button></div>
<div class="card"><div class="days" id="days"></div><div class="hours" id="hours"></div>
 <div id="ctl" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button id="prev">←</button><button id="play">▶ Play</button><button id="ff" title="Speed: click to cycle 1×, 2×, 4× (Play, and on the Live tab the simulated feed)">1×</button><button id="next">→</button><select id="demo"></select><button id="live" hidden></button></div></div>
<div class="cards" id="cards"></div>
<div class="row"><div class="card" id="cb"><div class="top-alert" id="ta" hidden></div><div class="chd"><div style="display:flex;align-items:center;flex-wrap:wrap"><p class="h4">Price €/MWh</p><span class="zm" role="group" aria-label="Zoom"><button id="zout" aria-label="Zoom out" title="Zoom out (−)">−</button><button id="zrst" title="Reset zoom (0)">1×</button><button id="zin" aria-label="Zoom in" title="Zoom in (+). Also Ctrl + scroll or pinch on the chart.">+</button></span></div><div class="lg" id="lg"></div></div><div id="chart"></div></div>
</div></div>

</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer wide" id="mx" role="dialog" aria-label="Metrics" aria-hidden="true"><header><b>Metrics</b><button id="mclose" aria-label="Close">✕</button></header>
 <div class="body"><div class="mxbar"><div class="seg" id="mxscope"><button data-s="run" class="on">Whole run</button><button data-s="day">Day of this forecast</button><button data-s="7">7 days</button><button data-s="30">30 days</button></div><span class="note" id="mxnote"></span></div>
 <div id="mxbody"></div></div></aside>
<script type="module">
import {setApiBase,Session,runSelect,demoSelect,keys,$,fmt,api,summary,showError,esc,sevLevel,level,cleanMsg} from "/shared/common.js";
import {LiveChart} from "/shared/live.js";
const isLiveRun=new URLSearchParams(location.search).get("run")==="live";const newSid=()=>(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).replace(/[^A-Za-z0-9_-]/g,"");
// a `sid` in the URL is a Live session the Explore page pre-built for this click; it is used once and removed, so a reload starts a fresh one
const urlSid=new URLSearchParams(location.search).get("sid"),SID=/^[A-Za-z0-9_-]{8,64}$/.test(urlSid||"")?urlSid:newSid();
if(urlSid){const q=new URLSearchParams(location.search);q.delete("sid");history.replaceState(null,"",location.pathname+(q.toString()?"?"+q:""));}   // one simulated Live session per page load: reload = fresh clock
if(isLiveRun)setApiBase("/live",{sid:SID});if(isLiveRun){for(const id of["prev","play","next"])$(id).hidden=true;$("lctl").append($("live"),$("ff"));$("lctl").hidden=false;document.querySelector("nav.tabs").after($("synth"));$("ctl").hidden=true;}   // Live: speed and Live buttons sit top centre of the page   // the Live tab talks to the simulated Live app under /live/
let reveal=new URLSearchParams(location.search).get("future")==="1";  // ?future=1 starts with the Future toggle on
const s=new Session((f,a,err)=>{ if(err) return showError($("chart"),err); s.last=[f,a]; draw(f,a); });
let LIVE=new URLSearchParams(location.search).get("live")==="1",feedDown=false,lastGrow=Date.now();   // live mode: ?live=1, or automatically for the synthetic live demo run
const liveBtn=()=>{if(!LIVE||!s.tl)return;const f=s.idx===s.n-1,b=$("live"),stale=Date.now()-lastGrow>45000;b.hidden=false;b.classList.toggle("on",f&&!feedDown);b.textContent=feedDown?"Server unreachable, retrying":(f?"Live":`Back to live (${s.n-1-s.idx} behind)`)+(stale?" · no new forecast for "+Math.round((Date.now()-lastGrow)/1000)+" s":"");};
s.listeners.push(()=>{ $("play").textContent=s.playing?"❚❚ Pause":"▶ Play"; if(s.tl){ navSync(); liveBtn(); } });
// theme
const th=localStorage.getItem?.("radar-theme");try{if(th)document.documentElement.dataset.theme=th}catch{}
$("theme").onclick=()=>{const d=document.documentElement,n=(d.dataset.theme==="dark"||(d.dataset.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches))?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("radar-theme",n)}catch{}s.last&&draw(...s.last)};
// day tiles + hour pills
function dayInfo(){const g={};s.tl.times.forEach((t,i)=>{const k=fmt.dayKey(t);(g[k]=g[k]||[]).push(i)});return g;}
function colour(v){return v>=.5?"#C62828":v>=.3?"#D55E00":v>=.15?"#E0A82E":"#5BAE8F";}
function buildDays(){
  const g=dayInfo();let h="";
  Object.entries(g).forEach(([k,ix])=>{const t=s.tl.times[ix[0]],mx=Math.max(...ix.map(i=>Math.max(s.tl.max_p_spike_high[i],s.tl.max_p_spike_low[i])));
   h+=`<div class="day" data-k="${k}" title="Max spike risk ${fmt.pct(mx)}"><small>${fmt.day(t).split(" ")[0]}</small><b>${fmt.day(t).split(" ")[1]}</b><small>${fmt.day(t).split(" ")[2]}</small><i style="background:${colour(mx)}"></i></div>`;});
  $("days").innerHTML=h;$("days").querySelectorAll(".day").forEach(d=>d.onclick=()=>{const ix=g[d.dataset.k];s.go(ix.find(i=>fmt.h(s.tl.times[i])==="12")??ix[0]);});
}
function navSync(){
  const g=dayInfo(),k=fmt.dayKey(s.origin);
  $("days").querySelectorAll(".day").forEach(d=>{d.classList.toggle("sel",d.dataset.k===k);if(d.dataset.k===k){const c=$("days");c.scrollLeft=d.offsetLeft-c.offsetLeft-(c.clientWidth-d.offsetWidth)/2;}});  // scroll the strip only, never the page
  $("hours").innerHTML=g[k].map(i=>{const sv=sevLevel(s.tl.max_severity[i]);return `<div class="hr ${i===s.idx?"sel ":""}${sv===2?"act":sv===1?"watch":""}" data-i="${i}">${fmt.h(s.tl.times[i])}</div>`}).join("");
  $("hours").querySelectorAll(".hr").forEach(e=>e.onclick=()=>s.go(+e.dataset.i));
}
const NOIMB=+new URLSearchParams(location.search).get("noimb")||10;  // EUR/MWh: below this expected |p50 - spot| over the next 2 h, the grid card says "no imbalance expected"
function gauge(p,label,sub){
  const a=Math.PI*Math.min(1,p/0.8),r=44,cx=55,cy=55,x=cx-r*Math.cos(a),y=cy-r*Math.sin(a),col=colour(p);
  return `<div class="card g"><h3>${label}</h3><svg viewBox="0 0 110 62" width="130" role="img" aria-label="${label} ${fmt.pct(p)}"><path d="M11 55 A44 44 0 0 1 99 55" fill="none" stroke="var(--line)" stroke-width="9" stroke-linecap="round"/><path d="M11 55 A44 44 0 0 1 ${x} ${y}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"/></svg><div class="v">${fmt.pct(p)}</div><small>${sub}</small></div>`;
}
function draw(f,a){
  const m=summary(f),r=f.rows,pu=m.pUp2h,ph=Math.max(...r.map(x=>x.p_spike_high)),pl=Math.max(...r.map(x=>x.p_spike_low));
  $("cards").innerHTML=gauge(ph,"Price jump risk","peak "+fmt.hm(m.hi.t))+gauge(pl,"Price drop risk","peak "+fmt.hm(m.lo.t))+
   `<div class="card g"><h3>Grid needs · next 2 h</h3><div class="tug" role="img" aria-label="${fmt.pct(pu)} up"><div style="width:${pu*100}%"></div></div><div style="display:flex;justify-content:space-between;font-size:13px"><b style="color:var(--up)">▲ More ${fmt.pct(pu)}</b><b style="color:var(--down)">▼ Less ${fmt.pct(1-pu)}</b></div></div>`+
   `<div class="card g"><h3>Next quarter</h3><div style="font-size:30px;font-weight:800;margin-top:8px">${fmt.eur(m.p50now)} <span style="font-size:14px;font-weight:600;color:var(--mute)">€/MWh</span></div><small>${fmt.eur(m.p10now)} to ${fmt.eur(m.p90now)} €/MWh</small></div>`;
  lc.setReveal(reveal);lc.setAlerts(a);lc.setForecast(f);
  const seen=reveal?r.filter(x=>x.imbalance!=null):[],hit=seen.filter(x=>x.imbalance>=x.p10&&x.imbalance<=x.p90).length;
  const it=(k,sw,label)=>`<button class="lgi${lc.vis[k]?"":" off"}" data-k="${k}" aria-pressed="${lc.vis[k]}" title="Show / hide">${sw}${label}</button>`;
  $("lg").innerHTML=it("actual",'<i style="border-color:var(--fg);width:11px"></i><i class="d" style="border-color:var(--fg);width:11px;margin-left:-3px"></i>',"Actual")+it("best",'<i style="border-color:var(--fc)"></i>',"Predicted")+it("spot",'<i class="d" style="border-color:var(--spot)"></i>',"Spot")+(`<button class="lgi${reveal?"":" off nostrike"}" data-k="future" aria-pressed="${reveal}" title="Show the actual prices after the forecast time (what happened)"><i class="d" style="border-color:var(--fg);border-top-style:dotted;width:16px"></i>Future${reveal&&seen.length?` <small>${hit}/${seen.length} in range</small>`:""}</button>`);
  $("lg").querySelectorAll(".lgi").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="future"){reveal=!reveal;lc.setReveal(reveal);s.last&&draw(...s.last);return;}const on=!lc.vis[k];lc.setVis(k,on);(PAIR[k]||[]).forEach(x=>lc.setVis(x,on));b.classList.toggle("off",!lc.vis[k]);b.setAttribute("aria-pressed",lc.vis[k]);try{localStorage.setItem("radar-vis",JSON.stringify(lc.vis))}catch{}});
  topAlert(f,a);
}
